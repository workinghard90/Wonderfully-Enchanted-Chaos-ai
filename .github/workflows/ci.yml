name: Verify engine and studio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: wec --help
      - run: wec-studio --help
      - run: wec doctor
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install .
      - run: python tools/storage_benchmark.py --count 12 --image-kib 128
      - run: python -m unittest discover -s tests -p test_media_smoke.py -v
      - run: python -m unittest discover -s tests -p test_backup_video.py -v
      - run: python -m unittest discover -s tests -p test_studio_video.py -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      # Cache only downloaded npm packages and Chromium binary; Linux
      # runtime dependencies still come from the standard Ubuntu runner.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: wec-npm-${{ runner.os }}-playwright-1.62.1-v1
      - uses: actions/cache@v4
        id: chromium-cache
        with:
          path: ~/.cache/ms-playwright
          key: wec-chromium-${{ runner.os }}-playwright-1.62.1-v1
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install-deps chromium
      - if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils
      - run: node tests/browser_smoke.cjs
      - run: node tests/browser_generation.cjs
      - run: node tests/browser_recovery.cjs
      - run: node tests/browser_video.cjs
      - run: node tests/coloring_print_check.cjs
      - run: node tests/browser_coloring.cjs
      - run: node tests/coloring_zip.cjs
      - run: node tests/browser_coloring_recovery.cjs
      - uses: actions/checkout@v4
        with:
          repository: workinghard90/Cozy-Creations-repository
          ref: dfe4b9fc4d0201268769dbc1f1153a6425826476
          path: .handoff-cozy
          persist-credentials: false
      # Run every regression even if an earlier one fails, then fail the job
      # if any suite did. This prevents one hidden-step bug masking others.
      - name: Complete studio browser regression suite
        shell: bash
        run: |
          failed=0
          for suite in browser_pages browser_cozy_handoff browser_creative browser_guided_workflow browser_ai_connection browser_image_recovery browser_checkpoints browser_promo browser_video_retry browser_online_storage; do
            echo "::group::${suite}"
            if node "tests/${suite}.cjs"; then
              echo "PASS ${suite}"
            else
              echo "::error::FAIL ${suite}"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "${failed}"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wec-video-test .
      - name: Check pinned voice on CPU within 512 MiB
        run: |
          docker run --rm --memory=512m --cpus=1 --entrypoint python wec-video-test -c '
          import json, os, tempfile, resource
          from pathlib import Path
          from wec_engine.studio_video_worker import narrate
          root = Path(tempfile.mkdtemp())
          (root / "plan.json").write_text(json.dumps({"scenes": [{"id": "scene-001", "narration": "A little lantern glows."}]}))
          narrate(root, Path(os.environ["WEC_PIPER_MODEL"]))
          assert (root / "scene-001-raw.wav").stat().st_size > 1000
          print({"cpu_voice_ok": True, "peak_rss_kib": resource.getrusage(resource.RUSAGE_SELF).ru_maxrss})
          '
      - name: Check captioned export within 512 MiB
        run: |
          docker run --rm --memory=512m --cpus=1 \
            --mount "type=bind,source=$PWD/tests,target=/tmp/wec-tests,readonly" \
            --workdir /tmp/wec-tests --entrypoint python wec-video-test \
            -m unittest test_backup_video.BackupMovieMediaTests -v
